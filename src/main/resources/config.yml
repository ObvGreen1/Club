  only-staff-kick: "&3● &cOnly the club owner or admins can kick players."
  only-owner-admin: "&3● &cOnly the club owner can promote admins."
  only-owner-demote: "&3● &cOnly the club owner can demote admins."
  cannot-kick-admin: "&3● &cYou cannot kick another club admin."
  owner-already-highest: "&3● &cThe owner already has the highest role."
  already-admin: "&3● &cThat player is already a club admin."
  not-admin: "&3● &cThat player is not a club admin."
  cannot-demote-owner: "&3● &cYou cannot demote the club owner."
  admin-promoted: "&3● &b%player% &7has been promoted to club admin."
  admin-promoted-notify: "&3● &7You have been promoted to admin in &b%club%&7."
  admin-demoted: "&3● &b%player% &7has been demoted from club admin."
  admin-demoted-notify: "&3● &7You have been demoted from admin in &b%club%&7."